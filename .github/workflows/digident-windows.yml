name: Digident Windows Build

# Windows x64 only. Manual trigger. Nothing is published as a public Release:
# the results stay in the run's Artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.0"

jobs:
  bridge:
    uses: ./.github/workflows/bridge.yml

  topmost:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows:
    name: build-windows-x64
    needs: [bridge, topmost]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      # Put Digident server + public key into hbb_common/src/config.rs before compiling.
      # Values come from repository secrets DG_SERVER and DG_KEY (never from the code).
      - name: Apply Digident server settings
        shell: python
        env:
          DG_SERVER: ${{ secrets.DG_SERVER }}
          DG_KEY: ${{ secrets.DG_KEY }}
        run: |
          import os, re, sys
          server = os.environ.get("DG_SERVER", "").strip()
          key = os.environ.get("DG_KEY", "").strip()
          if not server or not key:
              sys.exit("Missing repository secret DG_SERVER or DG_KEY")
          if not re.fullmatch(r"[A-Za-z0-9.\-:]+", server):
              sys.exit("DG_SERVER contains unexpected characters")
          if not re.fullmatch(r"[A-Za-z0-9+/=]{40,48}", key):
              sys.exit("DG_KEY does not look like a public key (expected ~44 base64 characters)")
          path = "libs/hbb_common/src/config.rs"
          with open(path, encoding="utf-8", newline="") as f:
              text = f.read()
          text, n1 = re.subn(
              r'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[[^\]]*\];',
              lambda m: 'pub const RENDEZVOUS_SERVERS: &[&str] = &["' + server + '"];',
              text)
          text, n2 = re.subn(
              r'pub const RS_PUB_KEY: &str = "[^"]*";',
              lambda m: 'pub const RS_PUB_KEY: &str = "' + key + '";',
              text)
          if n1 != 1 or n2 != 1:
              sys.exit("Patch failed: server matches=%d, key matches=%d" % (n1, n2))
          with open(path, "w", encoding="utf-8", newline="") as f:
              f.write(text)
          print("config.rs patched: server and key applied")


      # Hide the network/server settings from end users and pin the server + key so
      # they cannot be redirected through the UI or a hand-edited user config file.
      # The values come from the constants patched in the previous step.
      - name: Apply Digident client settings
        shell: python
        run: |
          import sys
          path = "src/common.rs"
          with open(path, encoding="utf-8", newline="") as f:
              text = f.read()
          marker = "pub fn load_custom_client() {"
          if text.count(marker) != 1:
              sys.exit("load_custom_client() not found exactly once in src/common.rs")
          if "apply_digident_client_settings" in text:
              sys.exit("src/common.rs already patched")
          rust_fn = """
          // ---- Digident: built-in client settings (added by CI patch) ----
          fn apply_digident_client_settings() {
              *config::APP_NAME.write().unwrap() = "Digident Support".to_owned();
              {
                  let mut b = config::BUILTIN_SETTINGS.write().unwrap();
                  for k in [
                      "hide-network-settings",
                      "hide-server-settings",
                      "hide-proxy-settings",
                      "hide-websocket-settings",
                  ] {
                      b.insert(k.to_owned(), "Y".to_owned());
                  }
              }
              {
                  let mut o = config::OVERWRITE_SETTINGS.write().unwrap();
                  o.insert(
                      "custom-rendezvous-server".to_owned(),
                      config::RENDEZVOUS_SERVERS[0].to_owned(),
                  );
                  o.insert("key".to_owned(), config::RS_PUB_KEY.to_owned());
              }
          }
          """
          text = text.replace(marker, marker + "\n    apply_digident_client_settings();", 1)
          text = text.rstrip("\r\n") + "\n" + rust_fn
          with open(path, "w", encoding="utf-8", newline="") as f:
              f.write(text)
          print("src/common.rs patched")

      # Branding: icons + agreement + left-panel logo from digident-branding/, version info,
      # MSI contact links, accent colour. The Purslane Tech copyright line is kept on purpose
      # (AGPL notice).
      - name: Apply Digident branding
        shell: python
        run: |
          import os, shutil, sys

          src = "digident-branding"
          if not os.path.isdir(src):
              sys.exit("Folder digident-branding/ was not found in the repo")

          # mode: must = destination has to exist already, optional = replace only if present,
          #       create = create or replace
          copies = [
              ("icon.ico", "res/icon.ico", "must"),
              ("icon.ico", "flutter/windows/runner/resources/app_icon.ico", "must"),
              ("icon.ico", "flutter/assets/icon.ico", "optional"),
              ("icon.png", "res/icon.png", "must"),
              ("icon.png", "flutter/assets/icon.png", "optional"),
              ("32x32.png", "res/32x32.png", "must"),
              ("64x64.png", "res/64x64.png", "must"),
              ("128x128.png", "res/128x128.png", "must"),
              ("128x128_2x.png", "res/128x128@2x.png", "must"),
              ("tray-icon.ico", "res/tray-icon.ico", "must"),
              ("License.rtf", "res/msi/Package/License.rtf", "must"),
              ("left-panel.png", "flutter/assets/logo.png", "create"),
          ]
          for name, dest, mode in copies:
              s = os.path.join(src, name)
              if not os.path.isfile(s):
                  sys.exit("Missing branding file: " + s)
              if os.path.exists(dest):
                  shutil.copyfile(s, dest)
                  print("replaced", dest)
              elif mode == "must":
                  sys.exit("Expected file not found in the repo: " + dest)
              elif mode == "create":
                  os.makedirs(os.path.dirname(dest), exist_ok=True)
                  shutil.copyfile(s, dest)
                  print("created", dest)
              else:
                  print("skipped (not present):", dest)

          def patch(path, pairs, strict=True):
              with open(path, encoding="utf-8", newline="") as f:
                  t = f.read()
              for old, new in pairs:
                  if t.count(old) < 1:
                      msg = "pattern not found in " + path + ": " + old
                      if strict:
                          sys.exit(msg)
                      print("WARNING:", msg)
                      continue
                  t = t.replace(old, new)
              with open(path, "w", encoding="utf-8", newline="") as f:
                  f.write(t)
              print("patched", path)

          # Version info shown in the exe properties (Details tab) and Task Manager.
          patch("flutter/windows/runner/Runner.rc", [
              ('VALUE "CompanyName", "Purslane Tech Pte. Ltd."', 'VALUE "CompanyName", "Digident"'),
              ('VALUE "FileDescription", "RustDesk Remote Desktop"', 'VALUE "FileDescription", "Digident Support"'),
              ('VALUE "InternalName", "rustdesk"', 'VALUE "InternalName", "Digident Support"'),
              ('VALUE "OriginalFilename", "rustdesk.exe"', 'VALUE "OriginalFilename", "Digident Support.exe"'),
              ('VALUE "ProductName", "RustDesk"', 'VALUE "ProductName", "Digident Support"'),
              ('All rights reserved." "\\0"', 'All rights reserved. Modified by Digident." "\\0"'),
          ])

          # Support / contact links shown in Programs and Features.
          patch("res/msi/preprocess.py", [
              ('"https://github.com/rustdesk/rustdesk/issues/"', '"https://www.digident.gr/support"'),
              ('"https://github.com/rustdesk/rustdesk"', '"https://www.digident.gr"'),
          ], strict=False)

          # Orange accent colour sampled from the old Digident Support screenshot (#E07510).
          patch("flutter/lib/common.dart", [
              ("static const Color accent = Color(0xFF0071FF);", "static const Color accent = Color(0xFFE07510);"),
              ("static const Color accent50 = Color(0x770071FF);", "static const Color accent50 = Color(0x77E07510);"),
              ("static const Color accent80 = Color(0xAA0071FF);", "static const Color accent80 = Color(0xAAE07510);"),
              ("static const Color button = Color(0xFF2C8CFF);", "static const Color button = Color(0xFFE07510);"),
          ])

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" || true
        shell: bash

      - name: Build rustdesk
        run: |
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
            if (Test-Path ./flutter/build/windows/x64/runner/Release) { $ok = $true; break }
            Write-Host "Build attempt $i failed (output folder missing). Retrying..."
          }
          if (-not $ok) { Write-Error "Build failed after 3 attempts"; exit 1 }
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          # Rename the executable to match the app name (the MSI looks for <app-name>.exe)
          Rename-Item ./rustdesk/rustdesk.exe "Digident Support.exe"

          # Download usbmmidd_v2.zip and extract it to ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          # Download printer driver files and extract them to ./rustdesk
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
            } else {
                Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
            }
          } catch {
              Write-Host "Ingore the printer driver error."
          }

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Upload unsigned application folder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digident-unsigned-folder-x64
          path: rustdesk
          retention-days: 14

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/Digident Support.exe"
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/Digident_Support_Portable-${{ env.VERSION }}.exe

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          msbuild-architecture: x86

      - name: Build msi
        run: |
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk -m Digident --app-name "Digident Support"
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName ../../SignOutput/Digident_Support_Setup-${{ env.VERSION }}.msi
          sha256sum ../../SignOutput/Digident_Support_Setup-*.msi

      - name: Upload installers (unsigned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digident-windows-x64
          path: ./SignOutput
          retention-days: 14
